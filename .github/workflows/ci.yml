name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scenario 3 checks out an earlier release (R1) from history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx feltkit doctor
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Scenario 6 live (real agent processes over MCP, crash and recovery)
        run: npm run scenario:6-live
      - name: Scenario 7 (platform upgrade from FeltKit 0.3.12 + FeltDB 0.20.0)
        run: npm run scenario:7
      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-evidence
          path: evidence/
          if-no-files-found: ignore
